# Ensembl https://www.ensembl.org/index.html
# The `Ensembl.*.<release>.tsv` files are created by `scripts/fetch_ensembl.py mouse 68 <release>`. It reads the
# MySQL dumps of the core database at https://ftp.ensembl.org/pub/release-<release>/mysql/. Only the last release is
# kept, except for the gene names, which come from every release since 68 (the first one using GRCm38).
#
# The transcripts and proteins of each current gene, as BioMart lists them, split by whether the gene is on the
# reference (primary) assembly. A name which is connected to a reference gene is connected only to the reference ones
# (and not to the copies of a gene on alternate haplotypes, or to retired genes).
- data_file: Ensembl.Reference.{version}.tsv
  is_reference: true
  links:
  - from:
      column: Transcript stable ID
      namespace: EnsemblTranscript
    to:
      column: Gene stable ID
      namespace: EnsemblGene
  - from:
      column: Protein stable ID
      namespace: EnsemblProtein
    to:
      column: Gene stable ID
      namespace: EnsemblGene
- data_file: Ensembl.NonReference.{version}.tsv
  links:
  - from:
      column: Transcript stable ID
      namespace: EnsemblTranscript
    to:
      column: Gene stable ID
      namespace: EnsemblGene
  - from:
      column: Protein stable ID
      namespace: EnsemblProtein
    to:
      column: Gene stable ID
      namespace: EnsemblGene

# The `stable_id_event` table, split by type. We only keep the unique pairs of its `old_stable_id` and
# `new_stable_id` columns. A few lines do not mention any identifier of their type. These are errors in the Ensembl
# data, and are skipped.
- data_file: Ensembl.Genes.{version}.tsv
  links:
  - from:
      column: Old stable ID
      namespace: EnsemblGene
    to:
      column: New stable ID
      namespace: EnsemblGene
- data_file: Ensembl.Transcripts.{version}.tsv
  links:
  - from:
      column: Old stable ID
      namespace: EnsemblTranscript
    to:
      column: New stable ID
      namespace: EnsemblTranscript
- data_file: Ensembl.Proteins.{version}.tsv
  links:
  - from:
      column: Old stable ID
      namespace: EnsemblProtein
    to:
      column: New stable ID
      namespace: EnsemblProtein

# MGI (Mouse Genome Informatics): https://www.informatics.jax.org/
# The `MGI.<release>.<date>.tsv` file is https://www.informatics.jax.org/downloads/reports/MRK_List1.rpt, created by
# `scripts/fetch_mgi.sh`. MGI identifies its data by its release and the date of its (weekly) database update.
- data_file: MGI.{version}.tsv
  links:
  - from:
      column: MGI Accession ID
      namespace: MGI
    to:
      column: Current MGI Accession ID (if withdrawn)
      namespace: MGI
  - from:
      column: Marker Synonyms (pipe-separated)
      namespace: GeneSymbol
      separator: '|'
      is_clean: false
    to:
      column: [ Current Marker Symbol (if withdrawn), Marker Symbol ]
      namespace: GeneSymbol
    priority: 2
  - from:
      column: Marker Symbol
      namespace: GeneSymbol
    to:
      column: Current Marker Symbol (if withdrawn)
      namespace: GeneSymbol
    priority: 3
  - from:
      column: [ Current Marker Symbol (if withdrawn), Marker Symbol ]
      namespace: GeneSymbol
    to:
      column: [ Current MGI Accession ID (if withdrawn), MGI Accession ID ]
      namespace: MGI
    priority: 5

# Ensembl (see above): the MGI xrefs of each gene, as BioMart lists them.
- data_file: Ensembl.MGI.{version}.tsv
  links:
  - from:
      column: MGI ID
      namespace: MGI
    to:
      column: Gene stable ID
      namespace: EnsemblGene

# Ensembl (see above): the UCSC xrefs of each transcript, as BioMart lists them.
- data_file: Ensembl.UCSC.{version}.tsv
  links:
  - from:
      column: UCSC Stable ID
      namespace: UCSC
    to:
      column: Gene stable ID
      namespace: EnsemblGene

# Ensembl (see above): the RefSeq xrefs of each transcript or protein, as BioMart lists them.
- data_file: Ensembl.RefSeq_mRNA.{version}.tsv
  links:
  - from:
      column: RefSeq mRNA ID
      namespace: RefSeq
    to:
      column: Gene stable ID
      namespace: EnsemblGene
- data_file: Ensembl.RefSeq_ncRNA.{version}.tsv
  links:
  - from:
      column: RefSeq ncRNA ID
      namespace: RefSeq
    to:
      column: Gene stable ID
      namespace: EnsemblGene
- data_file: Ensembl.RefSeq_peptide.{version}.tsv
  links:
  - from:
      column: RefSeq peptide ID
      namespace: RefSeq
    to:
      column: Gene stable ID
      namespace: EnsemblGene

# Ensembl (see above): the name of each gene in each release (its `display_xref_id`). Ensembl does not keep the
# history of these names. Later releases drop many of them, such as the clone-based names. Some names move to a
# different gene. Each name is taken only from the newest release which has it. A release whose names all appear in
# newer releases is removed by `scripts/fetch_ensembl.py`.
- data_file: Ensembl.GeneName.{version}.tsv
  has_multiple_versions: true
  older_versions_priority: 1
  links:
  - from:
      column: Gene name
      namespace: GeneSymbol
    to:
      column: Gene stable ID
      namespace: EnsemblGene
    priority: 4
