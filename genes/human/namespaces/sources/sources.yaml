# Ensembl https://www.ensembl.org/index.html
# Download via: https://www.ensembl.org/biomart/martview
#   Ensembl Genes 112
#   Human genes (GRCh38.p14)
# Each column is a selected attribute.
- data_file: Ensembl.tsv
  links:
  - from:
      column: Transcript stable ID
      namespace: EnsemblTranscript
    to:
      column: Gene stable ID
      namespace: EnsemblGene
  - from:
      column: Protein stable ID
      namespace: EnsemblProtein
    to:
      column: Gene stable ID
      namespace: EnsemblGene

# Ensembl https://www.ensembl.org/index.html
# Downloaded URL: https://ftp.ensembl.org/pub/release-112/mysql/homo_sapiens_core_112_38/stable_id_event.txt.gz
# This is a dump of the `stable_id_event` table. It has no header line, and its columns are `old_stable_id`,
# `old_version`, `new_stable_id`, `new_version`, `mapping_session_id`, `type` and `score`; we only use the two
# stable identifier columns.
# The download itself is not kept here (it is 126MB). It was split by identifier prefix into the three files
# below, which is an exact partition of its 2636483 lines:
#     grep ENSG stable_id_event.txt > Ensembl.Genes.tsv        #  607024 lines
#     grep ENST stable_id_event.txt > Ensembl.Transcripts.tsv  # 1436219 lines
#     grep ENSP stable_id_event.txt > Ensembl.Proteins.tsv     #  593240 lines
# We then removed three lines from Ensembl.Transcripts.tsv. They carry transcript identifiers but are typed
# `translation`, which is an error in the Ensembl data (the mouse dump has no such lines):
#     \N               \N  ENST00000515292  1  417  translation  0
#     ENST00000515292  1   ENST00000516410  1  418  translation  0.99
#     \N               \N  ENST00000516411  1  418  translation  0
- data_file: Ensembl.Genes.tsv
  has_header: false
  links:
  - from:
      column: 0
      namespace: EnsemblGene
    to:
      column: 2
      namespace: EnsemblGene
- data_file: Ensembl.Transcripts.tsv
  has_header: false
  links:
  - from:
      column: 0
      namespace: EnsemblTranscript
    to:
      column: 2
      namespace: EnsemblTranscript
- data_file: Ensembl.Proteins.tsv
  has_header: false
  links:
  - from:
      column: 0
      namespace: EnsemblProtein
    to:
      column: 2
      namespace: EnsemblProtein

# HGNC (Hugo Gene Nomenclature Committee) https://www.genenames.org
# Via: https://www.genenames.org/download/archive/
# Downloaded URL: https://g-a8b222.dd271.03c0.data.globus.org/pub/databases/genenames/hgnc/tsv/hgnc_complete_set.txt
# At date: 2024-07-06
- data_file: HGNC.Current.tsv
  links:
  - from:
      column: symbol
      namespace: GeneSymbol
    to:
      column: hgnc_id
      namespace: HGNC
  - from:
      column: prev_symbol
      namespace: GeneSymbol
      separator: '|'
    to:
      column: symbol
      namespace: GeneSymbol
  - from:
      column: alias_symbol
      namespace: GeneSymbol
      separator: '|'
    to:
      column: symbol
      namespace: GeneSymbol

# Downloaded URL: https://g-a8b222.dd271.03c0.data.globus.org/pub/databases/genenames/hgnc/tsv/withdrawn.txt
# At date: 2024-07-06
# And then subject to: `sed 's/@//g;s/Entry Withdrawn/Withdrawn/g;s/|[^ ,]*//g'`
- data_file: HGNC.Withdrawn.tsv
  links:
  - from:
      column: HGNC_ID
      namespace: HGNC
    to:
      column: MERGED_INTO_REPORT(S) (i.e HGNC_ID
      namespace: HGNC
      separator: ','
  - from:
      column: WITHDRAWN_SYMBOL
      namespace: GeneSymbol
    to:
      column: MERGED_INTO_REPORT(S) (i.e HGNC_ID
      namespace: HGNC
      separator: ','

